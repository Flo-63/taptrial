# Bei jedem Push auf main: Browser-Tests (Playwright, auch Versionswechsel des Service Workers) und
# Container-Tests. Eigener Lauf neben „Tests“, damit eine schnelle Rückmeldung nicht auf ihn wartet.
name: E2E

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: uv sync --frozen
      - name: Browser
        run: uv run playwright install --with-deps chromium
      - name: Schriften
        run: sudo apt-get install -y fontconfig fonts-dejavu-core fonts-dejavu-extra
      - name: Browser-Tests
        run: uv run pytest -q -n 2 tests/e2e
      - name: Container-Tests
        run: uv run pytest -q tests/container
