# Bei einem Tag v* das Docker-Image für amd64 und arm64 bauen und nach
# ghcr.io/<konto>/taptrial:<version> und :latest schieben. Nur der eingebaute GITHUB_TOKEN.
name: Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Version aus dem Tag (muss zu pyproject.toml passen)
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          projekt="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$version" != "$projekt" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject.toml ($projekt)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taptrial" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
