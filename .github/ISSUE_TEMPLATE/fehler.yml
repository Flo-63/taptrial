name: Fehler melden
description: Etwas funktioniert nicht wie beschrieben.
labels: ["Fehler"]
body:
  - type: markdown
    attributes:
      value: Bitte keine Namen oder anderen personenbezogenen Daten von Teilnehmern eintragen. Sicherheitslücken bitte vertraulich melden (SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: steht unter /version bzw. unten im Admin
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options: [Start, Ziel, Rennleitung, Posten, Zielmonitor, Ergebnisse, Admin, Installation/Docker, Sonstiges]
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: "1. … 2. … 3. …"
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet und tatsächlich
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser
      placeholder: "z. B. Android 15, Chrome 141"
