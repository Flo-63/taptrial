# TapTrial mit dem fertigen Image (ohne HTTPS). Für den Einsatz am Rennen HTTPS verwenden:
# docker-compose.caddy.yml – ohne HTTPS gibt es keinen Offline-Betrieb und keine App (PWA) auf den Handys.
#
#   cp .env.example .env    # RCB_TOKEN_ADMIN eintragen
#   docker compose up -d    # http://localhost:8000
services:
  app:
    image: ghcr.io/flo-63/taptrial:${TAPTRIAL_VERSION:-latest}
    env_file: .env
    ports:
      - "${TAPTRIAL_PORT:-8000}:8000"
    volumes:
      - taptrial-daten:/data
    restart: unless-stopped

volumes:
  taptrial-daten:
