[project]
name = "rcb-zeitfahren"
version = "0.1.1"
description = "Zeitnahme für ein Rennrad-Einzelzeitfahren"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "jinja2",
    "python-multipart",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "playwright",
    "pytest-playwright",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
