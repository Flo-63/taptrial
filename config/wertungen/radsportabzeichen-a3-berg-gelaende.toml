# Deutsches Radsportabzeichen – Disziplin A.3 "Bergzeitfahren Gelände" (nur Erwachsene)
# Quelle: German Cycling, "Leistungsanforderungen Deutsches Radsportabzeichen", Stand 12/2025
# Bewertet wird die Zeit PRO KM (Format M:SS): Fahrzeit / Streckenlänge der Veranstaltung.
# Gültig nur für Strecken von 3 bis 6 km mit 4-6 % Steigung. Die Steigung prüft die App nicht,
# sie wird bei der Veranstaltung bestätigt. Eine Stufe gilt als erreicht, wenn Zeit/km <= Schwellenwert.

name = "Deutsches Radsportabzeichen A.3 Bergzeitfahren Gelände (Stand 12/2025)"
art = "pro_km"
strecke_km_min = 3
strecke_km_max = 6

