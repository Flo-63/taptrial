# Klassennamen müssen exakt denen in config/altersklassen.toml entsprechen.
# Zeiten im Format H:MM:SS (Gesamtzeit). Eine Stufe gilt als erreicht, wenn die Fahrzeit <= Schwellenwert ist.
# Disziplinen A.2/A.3 (Bergzeitfahren, Zeit pro km) sind hier nicht abgebildet.

