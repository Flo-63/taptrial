<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- E2E lokal und auf GitHub mit denselben Schriften: nur DejaVu (Pakete fonts-dejavu-core und
     fonts-dejavu-extra). Gesetzt in tests/e2e/conftest.py, wirkt auf die Systemschrift der
     Geräteseiten; Admin und öffentliche Seiten bringen IBM Plex selbst mit. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
