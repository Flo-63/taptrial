{# Fußzeile der öffentlichen Seiten (nicht auf dem Zielmonitor): klein rechts unten Impressum,
   Datenschutz und Version – nie mitten im Inhalt #}
{% set rechtlich = rechtliches_links(installation(request)) %}
<footer class="oeffentlich-fuss" id="oeffentlich-fuss">
  {% for titel, url in rechtlich %}<a href="{{ url }}" class="rechtlich" data-rechtlich="{{ titel|lower }}"{% if url.startswith('https://') %} rel="noopener"{% endif %}>{{ titel }}</a>{% endfor %}
  <span class="app-version">{{ APP_NAME }} {{ APP_RELEASE }}</span>
</footer>
